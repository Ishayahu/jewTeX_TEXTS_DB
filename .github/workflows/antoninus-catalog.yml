name: Antoninus book-sorted catalogue

on:
  workflow_run:
    workflows: ["XML Validation and Server Update"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: antoninus-book-catalog-master
  cancel-in-progress: false

jobs:
  render-publish-deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Unicode XML parser
        run: python -m pip install lxml

      - name: Render full book-ordered catalogue
        run: python research/antoninus/render_catalog.py

      - name: Validate generated XML and reference count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree
          source=json.loads(Path('research/antoninus/registry.json').read_text(encoding='utf-8'))
          root=etree.fromstring(Path('lastov_ishayahu/chronos/9001.xml').read_text(encoding='utf-8'))
          links=root.xpath('//a[starts-with(@href,"https://www.sefaria.org/")]')
          assert len(links)==len(source['records']), (len(links),len(source['records']))
          assert {x.get('href') for x in links}=={x['url'] for x in source['records']}
          assert all(x.get('target')=='_blank' for x in links)
          print('Validated',len(links),'references')
          PY

      - name: Commit generated catalogue
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add lastov_ishayahu/chronos/9001.xml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'catalog: sort Antoninus references by source book and composition era'
          git push origin HEAD:master
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits do not start the ordinary push/deploy workflow.
      # This job starts after the ordinary deploy, and deploys its own new SHA.
      - name: Deploy generated catalogue to FreeBSD
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          awk -v host="[$DEPLOY_HOST]:4322" '
            function valid(type, key) {
              return (type == "ssh-ed25519" || type == "ssh-rsa" ||
                type ~ /^ecdsa-sha2-nistp(256|384|521)$/ ) &&
                key ~ /^[A-Za-z0-9+\/=]+$/
            }
            {
              if (valid($1, $2)) {
                print host, $1, $2
                matched = 1
              } else if (valid($2, $3)) {
                print host, $2, $3
                matched = 1
              }
            }
            END {
              if (!matched) {
                print "DEPLOY_KNOWN_HOSTS must contain an SSH server public key" > "/dev/stderr"
                exit 1
              }
            }
          ' <<< "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          verified_sha=$(git rev-parse HEAD)
          git ls-remote --exit-code origin refs/heads/master | grep -q "^${verified_sha}[[:space:]]"
          single_quote() {
            printf "'"
            printf '%s' "$1" | sed "s/'/'\\\\''/g"
            printf "'"
          }
          {
            printf 'set -eu\n'
            printf 'repo_path='
            single_quote "$DEPLOY_PATH"
            printf '\nverified_sha=%s\n' "$verified_sha"
            cat <<'REMOTE'
          cd "$repo_path"
          test "$(git branch --show-current)" = master
          git fetch origin master
          git reset --hard "$verified_sha"
          test "$(git rev-parse HEAD)" = "$verified_sha"
          REMOTE
          } | ssh -p 4322 -i "$HOME/.ssh/id_ed25519" \
             -o IdentitiesOnly=yes -o BatchMode=yes \
             -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
             "$DEPLOY_USER@$DEPLOY_HOST" sh -s
