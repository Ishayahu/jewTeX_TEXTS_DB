name: XML Validation and Server Update

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require info.xml in every content directory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_check_info_xml.py'
          python3 tools/check_info_xml.py

      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils xsltproc

      - name: Validate tracked XML files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            ((count += 1))
            if ! xmllint --noout "$file"; then
              echo "::error file=$file::XML validation failed"
              exit 1
            fi
          done < <(git ls-files -z -- '*.xml')
          if (( count == 0 )); then
            echo '::error::No tracked XML files found'
            exit 1
          fi
          echo "Validated $count XML files"

      - name: Validate formal XML schema and examples
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_xml_schema.py
          n=0
          while IFS= read -r -d '' file; do
            if ! xmllint --noout --nonet --relaxng schema/jewtex.rng "$file" >/dev/null 2>&1; then
              echo "::error file=$file::RELAX NG validation failed"
              xmllint --noout --nonet --relaxng schema/jewtex.rng "$file"
              exit 1
            fi
            ((n += 1))
          done < <(git ls-files -z -- '*.xml')
          echo "RELAX NG checked $n corpus files"

      - name: Audit structural debt and semantic chain integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/xml_audit.py --report "$RUNNER_TEMP/jewtex-xml-audit.json" --summary "$GITHUB_STEP_SUMMARY" --known-tags schema/element-inventory.json

      - name: Publish XML audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jewtex-xml-audit
          path: ${{ runner.temp }}/jewtex-xml-audit.json
          if-no-files-found: ignore

      - name: Reject non-XML files inside book directories
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r -d '' file; do
            IFS='/' read -r -a parts <<< "$file"
            # Only direct children of author/book, not assets and repository infrastructure.
            if [[ ${#parts[@]} -eq 3 && -f "${parts[0]}/${parts[1]}/info.xml" && "${parts[2]}" != *.xml ]]; then
              echo "::error file=$file::Book directories may only contain XML files"
              ((violations += 1))
            fi
          done < <(git ls-files -z)
          if (( violations > 0 )); then
            echo "::error::$violations non-XML file(s) found inside book directories"
            exit 1
          fi

  update-server:
    needs: validate-xml
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated commit over SSH (FreeBSD port 4322)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          # A non-default SSH port requires [host]:port in known_hosts.
          # The configured secret contains the verified public host key.
          awk -v host="[$DEPLOY_HOST]:4322" '
            function valid(type, key) {
              return (type == "ssh-ed25519" || type == "ssh-rsa" ||
                type ~ /^ecdsa-sha2-nistp(256|384|521)$/) &&
                key ~ /^[A-Za-z0-9+\/=]+$/
            }
            {
              if (valid($1, $2)) {
                print host, $1, $2
                matched = 1
              } else if (valid($2, $3)) {
                print host, $2, $3
                matched = 1
              }
            }
            END {
              if (!matched) {
                print "DEPLOY_KNOWN_HOSTS must contain an SSH server public key" > "/dev/stderr"
                exit 1
              }
            }
          ' <<< "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # FreeBSD accounts may use csh/tcsh as their login shell.
          # Pass a POSIX shell script on stdin; only a simple "sh -s" command
          # is interpreted by the login shell.
          single_quote() {
            printf "'"
            printf '%s' "$1" | sed "s/'/'\\\\''/g"
            printf "'"
          }

          {
            printf 'set -eu\n'
            printf 'repo_path='
            single_quote "$DEPLOY_PATH"
            printf '\nverified_sha=%s\n' "$GITHUB_SHA"
            cat <<'REMOTE'
          cd "$repo_path"
          test "$(git branch --show-current)" = master
          # GitHub master is authoritative for this deployment checkout.
          # Local edits to tracked files are disposable; leave untracked/ignored files alone.
          git fetch origin master
          git reset --hard "$verified_sha"
          test "$(git rev-parse HEAD)" = "$verified_sha"
          REMOTE
          } | ssh -p 4322 \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" sh -s
