<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-label="Географическая схема трёх объяснений сна Яакова: Раши и двух мнений, обсуждаемых Рамбаном">
<defs><marker id="arrGold" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b66c25"/></marker><marker id="arrNorth" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6b8392"/></marker></defs>
<style>.title{font:700 27px Arial,sans-serif;fill:#173c51}.intro{font:15px Arial,sans-serif;fill:#546b77}.model{font:700 20px Arial,sans-serif;fill:#173c51}.sub{font:13px Arial,sans-serif;fill:#6b7e88}.place{font:700 15px Arial,sans-serif;fill:#263a47}.minor{font:12px Arial,sans-serif;fill:#72838e}.foot{font:14px Arial,sans-serif;fill:#354c5a}</style>
<rect width="1200" height="715" fill="#f4f7f5"/>
<text x="29" y="48" class="title">Где стояла лестница Яакова?</text>
<text x="29" y="79" class="intro">Три объяснения в комментариях к Берешит 28:17. Указаны реальные взаимные направления мест, но не масштаб и не маршрут.</text>
<g><rect x="20" y="120" width="368" height="515" rx="17" fill="#ffffff" stroke="#d8dedf"/><text x="44" y="154" class="model">Раши</text><text x="44" y="176" class="sub">Гора Мория приходит к Лузу</text><path d="M 45 203 H 364" stroke="#e2e8e7"/><path d="M 255 244 V 218" stroke="#6b8392" stroke-width="1.5" marker-end="url(#arrNorth)"/><text x="265" y="221" class="minor">С</text><path d="M 63 468 L 95 326 L 101 225" stroke="#8b9ba2" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M 63 468 L 101 225" stroke="#267a9a" stroke-width="7" stroke-linecap="round" opacity=".78"/><path d="M 95 317 Q 30 256 97 242" fill="none" stroke="#b66c25" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrGold)"/><text x="44" y="548" class="foot">Лестница: Беэр-Шева → Бейт-Эль</text><text x="44" y="574" class="foot">Мория переносится к Лузу (чудо)</text><circle cx="101" cy="225" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="114" y="227" class="place">Бейт-Эль / Луз</text><text x="114" y="245" class="minor">севернее Иерусалима</text><circle cx="95" cy="326" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="108" y="328" class="place">Иерусалим</text><text x="108" y="346" class="minor">гора Мория / Храм</text><circle cx="63" cy="468" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="76" y="470" class="place">Беэр-Шева</text><text x="76" y="488" class="minor">южнее Иерусалима</text></g>
<g><rect x="416" y="120" width="368" height="515" rx="17" fill="#ffffff" stroke="#d8dedf"/><text x="440" y="154" class="model">Рамбан — рабби Йосе</text><text x="440" y="176" class="sub">Ноги в Беэр-Шеве, верх у Храма</text><path d="M 441 203 H 760" stroke="#e2e8e7"/><path d="M 651 244 V 218" stroke="#6b8392" stroke-width="1.5" marker-end="url(#arrNorth)"/><text x="661" y="221" class="minor">С</text><path d="M 459 468 L 491 326 L 497 225" stroke="#8b9ba2" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M 459 468 L 491 326" stroke="#267a9a" stroke-width="7" stroke-linecap="round" opacity=".78"/><text x="440" y="548" class="foot">Ночлег: Беэр-Шева</text><text x="440" y="574" class="foot">Верх лестницы: место Храма</text><text x="440" y="600" class="foot">«Бейт-Эль» — вопрос названия</text><circle cx="497" cy="225" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="510" y="227" class="place">Бейт-Эль / Луз</text><text x="510" y="245" class="minor">севернее Иерусалима</text><circle cx="491" cy="326" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="504" y="328" class="place">Иерусалим</text><text x="504" y="346" class="minor">гора Мория / Храм</text><circle cx="459" cy="468" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="472" y="470" class="place">Беэр-Шева</text><text x="472" y="488" class="minor">южнее Иерусалима</text></g>
<g><rect x="812" y="120" width="368" height="515" rx="17" fill="#ffffff" stroke="#d8dedf"/><text x="836" y="154" class="model">Рамбан — рабби Йеуда</text><text x="836" y="176" class="sub">Ноги на Мория, верх у Бейт-Эля</text><path d="M 837 203 H 1156" stroke="#e2e8e7"/><path d="M 1047 244 V 218" stroke="#6b8392" stroke-width="1.5" marker-end="url(#arrNorth)"/><text x="1057" y="221" class="minor">С</text><path d="M 855 468 L 887 326 L 893 225" stroke="#8b9ba2" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M 887 326 L 893 225" stroke="#267a9a" stroke-width="7" stroke-linecap="round" opacity=".78"/><text x="836" y="548" class="foot">Ночлег: гора Мория</text><text x="836" y="574" class="foot">Верх лестницы: Бейт-Эль / Луз</text><text x="836" y="600" class="foot">Путь сокращается, гора на месте</text><circle cx="893" cy="225" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="906" y="227" class="place">Бейт-Эль / Луз</text><text x="906" y="245" class="minor">севернее Иерусалима</text><circle cx="887" cy="326" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="900" y="328" class="place">Иерусалим</text><text x="900" y="346" class="minor">гора Мория / Храм</text><circle cx="855" cy="468" r="7" fill="#1c4562" stroke="white" stroke-width="2"/><text x="868" y="470" class="place">Беэр-Шева</text><text x="868" y="488" class="minor">южнее Иерусалима</text></g>
<path d="M 32 662 H 1158" stroke="#d7dedb"/>
<rect x="33" y="676" width="25" height="7" rx="3" fill="#267a9a" opacity=".78"/>
<text x="67" y="684" class="intro">условная лестница</text>
<path d="M 284 680 H 319" stroke="#b66c25" stroke-width="3" stroke-dasharray="7 5"/>
<text x="330" y="684" class="intro">предлагаемое Раши чудесное перемещение</text>
<text x="803" y="684" class="intro">Харан — значительно дальше к северо-востоку, вне схемы</text>
</svg>